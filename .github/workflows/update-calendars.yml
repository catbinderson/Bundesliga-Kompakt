name: Vereinskalender aktualisieren

on:
  schedule:
    - cron: "17 */6 * * *"
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "preview-source.txt"

permissions:
  contents: write
  pages: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Repository laden
        uses: actions/checkout@v4

      - name: Python einrichten
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Pillow installieren
        run: python -m pip install --quiet pillow

      - name: Facebook-Vorschaubild erzeugen
        run: |
          python - <<'PY'
          from PIL import Image, ImageDraw, ImageFont
          from pathlib import Path

          W,H=1200,630
          bg=(7,16,31)
          card=(14,26,48)
          green=(57,219,134)
          white=(248,251,255)
          muted=(169,184,204)
          im=Image.new('RGB',(W,H),bg)
          d=ImageDraw.Draw(im)
          d.rounded_rectangle((55,55,1145,575), radius=42, fill=card, outline=(32,54,86), width=3)

          def font(size,bold=False):
              candidates=[
                '/usr/share/fonts/truetype/dejavu/DejaVuSans-Bold.ttf' if bold else '/usr/share/fonts/truetype/dejavu/DejaVuSans.ttf',
                '/usr/share/fonts/truetype/liberation2/LiberationSans-Bold.ttf' if bold else '/usr/share/fonts/truetype/liberation2/LiberationSans-Regular.ttf'
              ]
              for p in candidates:
                  if Path(p).exists(): return ImageFont.truetype(p,size)
              return ImageFont.load_default()

          icon=Image.open('icon-512.png').convert('RGBA').resize((190,190),Image.Resampling.LANCZOS)
          im.paste(icon,(105,165),icon)

          d.text((350,130),'LigaKompakt',font=font(72,True),fill=white)
          d.text((352,225),'Bundesliga. Live. Kompakt.',font=font(36,False),fill=muted)
          d.rounded_rectangle((350,305,790,385),radius=25,fill=green)
          d.text((390,323),'100 % KOSTENLOS',font=font(34,True),fill=bg)
          d.text((352,430),'Live · Tabelle · Spielplan · Tipps · Statistiken',font=font(26,False),fill=white)
          d.text((352,485),'Keine Anmeldung · Keine versteckten Gebühren',font=font(24,False),fill=muted)
          im.save('facebook-preview-v6.jpg','JPEG',quality=92,optimize=True,progressive=False)
          PY

      - name: Kalender neu erzeugen
        run: python scripts/update_calendars.py

      - name: App-Version auf 1.0.7 anheben
        run: |
          python - <<'PY'
          from pathlib import Path

          replacements = {
              'app.js': [('const APP_VERSION="1.0.6"', 'const APP_VERSION="1.0.7"')],
              'index.html': [('<b>v1.0.6</b>', '<b>v1.0.7</b>')],
          }
          for filename, pairs in replacements.items():
              path = Path(filename)
              text = path.read_text(encoding='utf-8')
              for old, new in pairs:
                  text = text.replace(old, new)
              path.write_text(text, encoding='utf-8')
          PY

      - name: Änderungen speichern
        id: changes
        run: |
          git config user.name "LigaKompakt Bot"
          git config user.email "actions@users.noreply.github.com"
          git add calendars facebook-preview-v6.jpg app.js index.html
          if git diff --cached --quiet; then
            echo "Keine Änderungen vorhanden."
            echo "updated=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git commit -m "Aktualisiere LigaKompakt Kalenderdaten [skip ci]"
          git push
          echo "updated=true" >> "$GITHUB_OUTPUT"
          echo "commit=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: GitHub Pages neu veröffentlichen
        if: steps.changes.outputs.updated == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh api --method POST \
            -H "Accept: application/vnd.github+json" \
            "repos/${{ github.repository }}/pages/builds" >/tmp/pages-build.json
          cat /tmp/pages-build.json

      - name: Veröffentlichung prüfen
        if: steps.changes.outputs.updated == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          TARGET_COMMIT: ${{ steps.changes.outputs.commit }}
        run: |
          set -euo pipefail
          for attempt in $(seq 1 30); do
            json=$(gh api -H "Accept: application/vnd.github+json" "repos/${{ github.repository }}/pages/builds/latest")
            status=$(printf '%s' "$json" | python -c 'import json,sys; print(json.load(sys.stdin).get("status", ""))')
            commit=$(printf '%s' "$json" | python -c 'import json,sys; print(json.load(sys.stdin).get("commit", ""))')
            error=$(printf '%s' "$json" | python -c 'import json,sys; print((json.load(sys.stdin).get("error") or {}).get("message") or "")')
            echo "Pages-Status: $status · Commit: $commit"
            if [ -n "$error" ]; then
              echo "GitHub Pages Fehler: $error" >&2
              exit 1
            fi
            if [ "$commit" = "$TARGET_COMMIT" ] && [ "$status" = "built" ]; then
              echo "GitHub Pages wurde erfolgreich mit dem aktuellen Kalenderstand veröffentlicht."
              exit 0
            fi
            sleep 5
          done
          echo "GitHub Pages hat den neuen Kalenderstand nicht innerhalb von 150 Sekunden bestätigt." >&2
          exit 1
