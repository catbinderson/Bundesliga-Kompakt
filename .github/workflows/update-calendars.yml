name: Vereinskalender aktualisieren

on:
  schedule:
    - cron: "17 */6 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Repository laden
        uses: actions/checkout@v4
      - name: Python einrichten
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Kalender neu erzeugen
        run: python scripts/update_calendars.py
      - name: Änderungen speichern
        run: |
          if git diff --quiet -- calendars; then
            echo "Keine Terminänderungen vorhanden."
            exit 0
          fi
          git config user.name "LigaKompakt Kalenderbot"
          git config user.email "actions@users.noreply.github.com"
          git add calendars
          git commit -m "Aktualisiere Spieltermine automatisch [skip ci]"
          git push
