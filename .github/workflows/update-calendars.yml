name: Vereinskalender aktualisieren

on:
  schedule:
    - cron: "17 */6 * * *"
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "preview-source.txt"

permissions:
  contents: write
  pages: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Repository laden
        uses: actions/checkout@v4
      - name: Python einrichten
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Pillow installieren
        run: python -m pip install --quiet pillow
      - name: Facebook-Vorschaubild erzeugen
        run: |
          python - <<'PY'
          from PIL import Image, ImageDraw, ImageFont
          from pathlib import Path

          W,H=1200,630
          bg=(7,16,31)
          card=(14,26,48)
          green=(57,219,134)
          white=(248,251,255)
          muted=(169,184,204)
          im=Image.new('RGB',(W,H),bg)
          d=ImageDraw.Draw(im)
          d.rounded_rectangle((55,55,1145,575), radius=42, fill=card, outline=(32,54,86), width=3)

          def font(size,bold=False):
              candidates=[
                '/usr/share/fonts/truetype/dejavu/DejaVuSans-Bold.ttf' if bold else '/usr/share/fonts/truetype/dejavu/DejaVuSans.ttf',
                '/usr/share/fonts/truetype/liberation2/LiberationSans-Bold.ttf' if bold else '/usr/share/fonts/truetype/liberation2/LiberationSans-Regular.ttf'
              ]
              for p in candidates:
                  if Path(p).exists(): return ImageFont.truetype(p,size)
              return ImageFont.load_default()

          # echtes LigaKompakt-App-Icon
          icon=Image.open('icon-512.png').convert('RGBA').resize((190,190),Image.Resampling.LANCZOS)
          im.paste(icon,(105,165),icon)

          d.text((350,130),'LigaKompakt',font=font(72,True),fill=white)
          d.text((352,225),'Bundesliga. Live. Kompakt.',font=font(36,False),fill=muted)
          d.rounded_rectangle((350,305,790,385),radius=25,fill=green)
          d.text((390,323),'100 % KOSTENLOS',font=font(34,True),fill=bg)
          d.text((352,430),'Live · Tabelle · Spielplan · Tipps · Statistiken',font=font(26,False),fill=white)
          d.text((352,485),'Keine Anmeldung · Keine versteckten Gebühren',font=font(24,False),fill=muted)
          im.save('facebook-preview-v6.jpg','JPEG',quality=92,optimize=True,progressive=False)
          PY
      - name: Kalender neu erzeugen
        run: python scripts/update_calendars.py
      - name: Änderungen speichern
        id: changes
        run: |
          if git diff --quiet -- calendars facebook-preview-v6.jpg; then
            echo "Keine Änderungen vorhanden."
            echo "updated=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git config user.name "LigaKompakt Bot"
          git config user.email "actions@users.noreply.github.com"
          git add calendars facebook-preview-v6.jpg
          git commit -m "Aktualisiere LigaKompakt Daten und Vorschau [skip ci]"
          git push
          echo "updated=true" >> "$GITHUB_OUTPUT"
      - name: GitHub Pages neu veröffentlichen
        if: steps.changes.outputs.updated == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh api --method POST "repos/${{ github.repository }}/pages/builds"
