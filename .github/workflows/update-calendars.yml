name: Vereinskalender aktualisieren

on:
  schedule:
    - cron: "17 */6 * * *"
  workflow_dispatch:

permissions:
  contents: write
  pages: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Repository laden
        uses: actions/checkout@v4
      - name: Python einrichten
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Kalender neu erzeugen
        run: python scripts/update_calendars.py
      - name: Änderungen speichern
        id: changes
        run: |
          if git diff --quiet -- calendars; then
            echo "Keine Terminänderungen vorhanden."
            echo "updated=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git config user.name "LigaKompakt Kalenderbot"
          git config user.email "actions@users.noreply.github.com"
          git add calendars
          git commit -m "Aktualisiere Spieltermine automatisch [skip ci]"
          git push
          echo "updated=true" >> "$GITHUB_OUTPUT"
      - name: GitHub Pages neu veröffentlichen
        if: steps.changes.outputs.updated == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh api --method POST "repos/${{ github.repository }}/pages/builds"
