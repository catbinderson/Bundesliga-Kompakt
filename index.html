<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#0b1326">
  <title>LigaKompakt</title>
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <header class="topbar">
    <div>
      <div class="eyebrow">1. Fußball-Bundesliga</div>
      <h1>LigaKompakt</h1>
    </div>
    <button id="refreshBtn" class="icon-btn" aria-label="Aktualisieren">↻</button>
  </header>

  <main>
    <section id="today" class="view active">
      <div class="hero card">
        <div>
          <div class="eyebrow">AKTUELL</div>
          <h2 id="todayTitle">Bundesliga kompakt</h2>
          <p id="todaySub">Daten werden geladen …</p>
        </div>
        <div id="liveDot" class="status">Online</div>
      </div>
      <div id="todayMatches" class="stack"></div>
    </section>

    <section id="table" class="view">
      <div class="section-head">
        <div>
          <div class="eyebrow">SAISON 2026/27</div>
          <h2>Tabelle</h2>
        </div>
      </div>
      <div class="table-wrap card">
        <table>
          <thead>
            <tr><th>#</th><th>Verein</th><th>Sp</th><th>TD</th><th>Pkt</th></tr>
          </thead>
          <tbody id="tableBody"></tbody>
        </table>
      </div>
    </section>

    <section id="fixtures" class="view">
      <div class="section-head">
        <div>
          <div class="eyebrow">SPIELPLAN</div>
          <h2 id="matchdayTitle">Aktueller Spieltag</h2>
        </div>
        <select id="matchdaySelect" aria-label="Spieltag"></select>
      </div>
      <div id="fixturesList" class="stack"></div>
    </section>

    <section id="club" class="view">
      <div class="section-head">
        <div>
          <div class="eyebrow">FAVORIT</div>
          <h2>Mein Verein</h2>
        </div>
      </div>
      <div class="card favorite-card">
        <label for="teamSelect">Lieblingsverein</label>
        <select id="teamSelect"></select>
        <p class="muted">Die Auswahl wird nur auf diesem Gerät gespeichert.</p>
      </div>
      <div id="clubContent" class="stack"></div>
    </section>
  </main>

  <nav class="bottom-nav">
    <button data-view="today" class="nav active"><span>●</span>Heute</button>
    <button data-view="table" class="nav"><span>≡</span>Tabelle</button>
    <button data-view="fixtures" class="nav"><span>▦</span>Spielplan</button>
    <button data-view="club" class="nav"><span>★</span>Mein Verein</button>
  </nav>

  <template id="matchTpl">
    <article class="match card">
      <div class="match-meta"></div>
      <div class="team-row">
        <div class="team home"><img><span></span></div>
        <div class="score"></div>
        <div class="team away"><span></span><img></div>
      </div>
    </article>
  </template>

  <script src="app.js"></script>
</body>
</html>
